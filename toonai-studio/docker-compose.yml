services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: toonai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [toonai_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  toonai_pg:
